# 이벤트 데이터를 매일 새로 받아 GitHub Pages로 배포한다.
# Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 동작한다.
# API 키는 Settings → Secrets and variables → Actions 에 TOUR_API_KEY / KOPIS_API_KEY 로 등록.
name: Build data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST (21:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch events
        id: fetch
        # 실패해도 배포는 계속한다: 스크립트가 이전 배포본(PREV_URL)을 캐시로 다시 쓰거나,
        # 그마저 없으면 저장소에 커밋된 data/events.json(샘플)이 그대로 배포된다.
        continue-on-error: true
        timeout-minutes: 20
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
          PREV_URL: https://dayeonoh626-cyber.github.io/nolgot/data/events.json
          ENABLE_EN: '1'
        run: node scripts/fetch-events.mjs

      - name: Check data file
        run: |
          node -e "const j=require('./data/events.json'); if(!Array.isArray(j.events)) process.exit(1); console.log('events:', j.events.length, 'source:', j.meta && j.meta.source)"

      - name: Warn when fetch failed
        if: steps.fetch.outcome == 'failure'
        run: echo "::warning::이벤트 데이터 갱신에 실패해 이전/샘플 데이터로 배포합니다. 'Fetch events' 로그를 확인하세요."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
