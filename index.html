<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>놀곳</title>
  <meta name="description" content="한국·유럽 도시의 축제·공연·전시·클래스·투어·오디오가이드를 한눈에 · Festivals, shows, exhibitions, classes, tours and audio guides in Korean and European cities" />
  <meta name="theme-color" content="#f26a1b" />

  <!-- iOS Safari: 홈 화면에 추가 시 앱처럼 실행 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="놀곳" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="regionBtn" class="region-btn" aria-haspopup="dialog" data-i18n-aria="region.aria">
      <span class="pin" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="var(--accent)" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Z"/><circle cx="12" cy="9" r="2.6" fill="var(--surface, #fff)"/></svg></span>
      <span id="regionLabel"></span>
      <span class="caret" aria-hidden="true">▾</span>
    </button>
    <div class="topbar-right">
      <div id="sampleBadge" class="sample-badge" data-i18n="sample.badge" hidden>샘플 데이터</div>
      <button id="langBtn" class="lang-btn" type="button" data-i18n="lang.switch" data-i18n-aria="lang.switchAria">EN</button>
    </div>
  </header>

  <nav class="kinds" id="kindTabs" data-i18n-aria="nav.kinds"></nav>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" data-i18n-aria="nav.menu">
    <button data-tab="browse" class="active"><span aria-hidden="true">🏠</span><b class="tab-label" data-i18n="tab.browse">둘러보기</b></button>
    <button data-tab="calendar"><span aria-hidden="true">📅</span><b class="tab-label" data-i18n="tab.calendar">캘린더</b></button>
    <button data-tab="map"><span aria-hidden="true">🗺️</span><b class="tab-label" data-i18n="tab.map">지도</b></button>
    <button data-tab="saved"><span aria-hidden="true">♥</span><b class="tab-label" data-i18n="tab.saved">관심</b><em id="savedCount" hidden></em></button>
    <button data-tab="settings"><span aria-hidden="true">⚙︎</span><b class="tab-label" data-i18n="tab.settings">설정</b></button>
  </nav>

  <!-- 이벤트 상세 -->
  <dialog id="detail" class="sheet"></dialog>

  <!-- 지역 선택 -->
  <dialog id="regionSheet" class="sheet small"></dialog>

  <!-- iOS 설치 안내 -->
  <div id="installHint" class="install-hint" hidden>
    <div>
      <strong data-i18n="install.title">홈 화면에 앱 설치하기</strong>
      <p data-i18n-html="install.body"></p>
    </div>
    <button id="installClose" data-i18n-aria="install.close" aria-label="닫기">✕</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
